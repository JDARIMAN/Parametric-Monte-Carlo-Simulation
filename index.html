<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stardance – localization replay</title>
<style>
:root{
  --bg:#eef2f7; --panel:#ffffff; --ink:#14213a; --muted:#5b6b86; --line:#d3dbe8;
  --floor:#f7f9fc; --grid:#e1e8f2; --wall:#2a3a5c; --obst:#3b4d75;
  --truth:#0a8f5a; --est:#d6336c; --p-lo:#6fa3d8; --p-hi:#f08a00; --accent:#2f5fd0;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c1424; --panel:#131d33; --ink:#e6edf8; --muted:#93a3bf; --line:#26344f;
    --floor:#0f1a2e; --grid:#192744; --wall:#8aa0cc; --obst:#5c74a8;
    --truth:#3ddc97; --est:#ff6b9a; --p-lo:#3f6fa8; --p-hi:#ffb54a; --accent:#7aa2ff;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font:600 20px/1 ui-serif,Georgia,serif;margin:0;letter-spacing:.01em}
.sub{color:var(--muted)}
.spacer{flex:1}
.btn,button,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover,button:hover{border-color:var(--accent)}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=file]{display:none}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px 20px}
.stage{position:relative;min-height:320px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px}
#empty strong{font:600 18px/1.2 ui-serif,Georgia,serif}
#empty code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
#empty.err strong{color:var(--est)}
aside{display:flex;flex-direction:column;gap:14px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
dt{color:var(--muted)} dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.chart{height:150px;padding:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px 14px;border-top:1px solid var(--line);background:var(--panel)}
.controls input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.controls label{display:inline-flex;align-items:center;gap:5px;color:var(--muted);white-space:nowrap}
@media (max-width:820px){main{grid-template-columns:1fr;overflow:auto}.stage{height:60vh}}
</style>
</head>
<body>
<header>
  <h1>Stardance</h1>
  <span class="sub" id="sub">Monte Carlo localization replay</span>
  <span class="spacer"></span>
  <label class="btn primary">Load output file<input type="file" id="file" accept=".jsonl,.json,.txt"></label>
</header>

<main>
  <div class="stage" id="stage">
    <canvas id="map"></canvas>
    <div id="empty">
      <strong id="emptyTitle">No run loaded</strong>
      <span id="emptyMsg">Run your simulation, then load or drop its output file (<code>MCLsim_output.jsonl</code> by default) here.</span>
    </div>
  </div>
  <aside>
    <div class="card">
      <dl>
        <dt>Step</dt><dd id="sStep">–</dd>
        <dt>Time</dt><dd id="sTime">–</dd>
        <dt>Effective particles</dt><dd id="sNeff">–</dd>
        <dt>Position error</dt><dd id="sErr">–</dd>
        <dt>Heading error</dt><dd id="sHead">–</dd>
      </dl>
    </div>
    <div class="card chart"><canvas id="chart"></canvas></div>
    <div class="card legend">
      <span><i style="background:var(--truth)"></i>True robot</span>
      <span><i style="background:var(--est)"></i>Estimate</span>
      <span><i style="background:var(--p-hi)"></i>Heavy particle</span>
      <span><i style="background:var(--p-lo)"></i>Light particle</span>
    </div>
  </aside>
</main>

<div class="controls">
  <button id="play" class="primary" disabled>Play</button>
  <button id="back" disabled aria-label="Step back">◀</button>
  <button id="fwd" disabled aria-label="Step forward">▶</button>
  <input type="range" id="slider" min="0" max="0" value="0" disabled aria-label="Step">
  <select id="speed" aria-label="Speed">
    <option value="0.5">0.5×</option><option value="1" selected>1×</option>
    <option value="2">2×</option><option value="4">4×</option>
  </select>
  <label><input type="checkbox" id="tParticles" checked>Particles</label>
  <label><input type="checkbox" id="tTrails" checked>Trails</label>
  <label><input type="checkbox" id="tHeads">Headings</label>
</div>

<script>
const $ = s => document.querySelector(s);
const map = $('#map'), mc = map.getContext('2d'), chart = $('#chart'), cc = chart.getContext('2d');
let meta = null, frames = [], errs = [], k = 0, playing = false, acc = 0, prev = 0;
const BASE_FPS = 20;

/* ---------- loading ---------- */
function fail(msg){
  meta = null; frames = [];
  $('#empty').style.display = 'flex'; $('#empty').classList.add('err');
  $('#emptyTitle').textContent = 'Couldn’t read that file';
  $('#emptyMsg').textContent = msg;
  setEnabled(false); draw();
}
function load(text, name){
  const lines = text.split('\n').filter(l => l.trim());
  let m, f;
  try { m = JSON.parse(lines[0]); f = lines.slice(1).map(l => JSON.parse(l)); }
  catch (e) { return fail('Each line should be one JSON object, as written by the Stardance backend.'); }
  if (m.type !== 'map' || !f.length) return fail('The first line should describe the map, followed by one line per step.');
  meta = m; frames = f; k = 0; acc = 0;
  errs = f.map(s => Math.hypot(s.truth[0]-s.est[0], s.truth[1]-s.est[1]));
  $('#slider').max = f.length - 1;
  $('#empty').style.display = 'none'; $('#empty').classList.remove('err');
  $('#sub').textContent = `${name} · ${f.length} steps · ${m.n} particles shown`;
  setEnabled(true); setPlaying(true); resize();
}
function setEnabled(on){ ['play','back','fwd','slider'].forEach(id => $('#'+id).disabled = !on); }
$('#file').addEventListener('change', async e => { const f = e.target.files[0]; if (f) load(await f.text(), f.name); });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) load(await f.text(), f.name); });

/* ---------- geometry ---------- */
let sc = 1, offx = 0, offy = 0, W = 0, H = 0;
function fit(){
  W = map.clientWidth; H = map.clientHeight;
  if (!meta) return;
  const pad = 14;
  sc = Math.min((W - 2*pad) / meta.w, (H - 2*pad) / meta.l);
  offx = (W - meta.w*sc) / 2; offy = (H - meta.l*sc) / 2;
}
const px = x => offx + (x - meta.orix) * sc;
const py = y => offy + (meta.l - (y - meta.oriy)) * sc;
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));

function sizeCanvas(c, ctx){
  const r = devicePixelRatio || 1;
  c.width = Math.round(c.clientWidth * r); c.height = Math.round(c.clientHeight * r);
  ctx.setTransform(r, 0, 0, r, 0, 0);
}
function resize(){ sizeCanvas(map, mc); sizeCanvas(chart, cc); fit(); draw(); }
new ResizeObserver(resize).observe($('#stage'));
new ResizeObserver(() => { sizeCanvas(chart, cc); draw(); }).observe(chart.parentElement);

/* ---------- drawing ---------- */
const css = () => { const s = getComputedStyle(document.documentElement); return n => s.getPropertyValue(n).trim(); };
function arrow(ctx, x, y, yaw, size, color, ring){
  ctx.save(); ctx.translate(px(x), py(y)); ctx.rotate(-yaw);
  ctx.beginPath(); ctx.moveTo(size, 0); ctx.lineTo(-size*0.7, size*0.65); ctx.lineTo(-size*0.35, 0); ctx.lineTo(-size*0.7, -size*0.65); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  if (ring){ ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, size*1.35, 0, 7); ctx.stroke(); }
  ctx.restore();
}
function mix(a, b, t){ // blend two #rrggbb colors
  const p = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
  const A = p(a), B = p(b);
  return `rgb(${A.map((v, i) => Math.round(v + (B[i]-v)*t)).join(',')})`;
}
function draw(){
  const C = css();
  mc.clearRect(0, 0, W, H);
  if (!meta) { drawChart(C); return; }
  // floor + 1 m grid
  mc.fillStyle = C('--floor'); mc.fillRect(px(meta.orix), py(meta.oriy + meta.l), meta.w*sc, meta.l*sc);
  mc.strokeStyle = C('--grid'); mc.lineWidth = 1; mc.beginPath();
  for (let g = 0; g <= meta.w; g++){ const x = px(meta.orix + g); mc.moveTo(x, py(meta.oriy)); mc.lineTo(x, py(meta.oriy + meta.l)); }
  for (let g = 0; g <= meta.l; g++){ const y = py(meta.oriy + g); mc.moveTo(px(meta.orix), y); mc.lineTo(px(meta.orix + meta.w), y); }
  mc.stroke();
  // obstacle cells
  mc.fillStyle = C('--obst'); const cs = meta.res * sc + 0.6;
  for (const o of meta.obstacles) mc.fillRect(px(o[0]) - cs/2, py(o[1]) - cs/2, cs, cs);
  mc.strokeStyle = C('--wall'); mc.lineWidth = 2.5;
  mc.strokeRect(px(meta.orix), py(meta.oriy + meta.l), meta.w*sc, meta.l*sc);

  const f = frames[k];
  // trails
  if ($('#tTrails').checked){
    for (const [key, col] of [['truth', '--truth'], ['est', '--est']]){
      mc.strokeStyle = C(col); mc.globalAlpha = 0.55; mc.lineWidth = 1.6; mc.beginPath();
      for (let i = 0; i <= k; i++){ const p = frames[i][key]; i ? mc.lineTo(px(p[0]), py(p[1])) : mc.moveTo(px(p[0]), py(p[1])); }
      mc.stroke(); mc.globalAlpha = 1;
    }
  }
  // particles (colour = weight; 1.0 means “average”)
  if ($('#tParticles').checked){
    const lo = C('--p-lo'), hi = C('--p-hi'), heads = $('#tHeads').checked;
    for (const p of f.particles){
      const t = Math.min(1, Math.log1p(p[3]) / Math.log1p(20));
      mc.fillStyle = mix(lo, hi, t); mc.globalAlpha = 0.35 + 0.65*t;
      mc.beginPath(); mc.arc(px(p[0]), py(p[1]), 1.5 + 1.5*t, 0, 7); mc.fill();
      if (heads){ mc.strokeStyle = mc.fillStyle; mc.lineWidth = 1; mc.beginPath();
        mc.moveTo(px(p[0]), py(p[1])); mc.lineTo(px(p[0]) + Math.cos(p[2])*9, py(p[1]) - Math.sin(p[2])*9); mc.stroke(); }
    }
    mc.globalAlpha = 1;
  }
  arrow(mc, f.truth[0], f.truth[1], f.truth[2], 9, C('--truth'), false);
  arrow(mc, f.est[0], f.est[1], f.est[2], 9, C('--est'), true);
  drawChart(C); updateStats();
}
function drawChart(C){
  const w = chart.clientWidth, h = chart.clientHeight;
  cc.clearRect(0, 0, w, h);
  cc.fillStyle = C('--muted'); cc.font = '12px ui-sans-serif,system-ui,sans-serif';
  cc.fillText('Position error (m)', 2, 11);
  if (!errs.length) return;
  const top = 20, bot = h - 4, mx = Math.max(0.5, Math.ceil(Math.max(...errs) * 2) / 2);
  const X = i => 2 + i / Math.max(1, errs.length - 1) * (w - 4), Y = v => bot - v / mx * (bot - top);
  cc.strokeStyle = C('--line'); cc.lineWidth = 1; cc.beginPath(); cc.moveTo(0, bot); cc.lineTo(w, bot); cc.stroke();
  cc.fillText(mx.toFixed(1), w - 24, top + 10);
  for (const [from, to, a] of [[0, errs.length - 1, 0.3], [0, k, 1]]){
    cc.strokeStyle = C('--est'); cc.globalAlpha = a; cc.lineWidth = 1.5; cc.beginPath();
    for (let i = from; i <= to; i++) i === from ? cc.moveTo(X(i), Y(errs[i])) : cc.lineTo(X(i), Y(errs[i]));
    cc.stroke();
  }
  cc.globalAlpha = 1; cc.strokeStyle = C('--ink'); cc.beginPath(); cc.moveTo(X(k), top); cc.lineTo(X(k), bot); cc.stroke();
}
function updateStats(){
  const f = frames[k];
  $('#sStep').textContent = `${k + 1} / ${frames.length}`;
  $('#sTime').textContent = `${f.t.toFixed(1)} s`;
  $('#sNeff').textContent = Math.round(f.neff);
  $('#sErr').textContent = `${errs[k].toFixed(2)} m`;
  $('#sHead').textContent = `${(Math.abs(wrap(f.est[2] - f.truth[2])) * 180 / Math.PI).toFixed(1)}°`;
  $('#slider').value = k;
}

/* ---------- playback ---------- */
function setPlaying(on){ playing = on; $('#play').textContent = on ? 'Pause' : 'Play'; prev = 0; }
function go(i){ if (!frames.length) return; k = Math.max(0, Math.min(frames.length - 1, i)); draw(); }
function tick(now){
  if (playing && frames.length){
    if (prev) acc += (now - prev) / 1000 * BASE_FPS * parseFloat($('#speed').value);
    prev = now;
    while (acc >= 1){ acc -= 1; if (k < frames.length - 1) k++; else { setPlaying(false); break; } }
    draw();
  }
  requestAnimationFrame(tick);
}
$('#play').onclick = () => { if (k >= frames.length - 1) k = 0; setPlaying(!playing); };
$('#back').onclick = () => { setPlaying(false); go(k - 1); };
$('#fwd').onclick = () => { setPlaying(false); go(k + 1); };
$('#slider').oninput = e => { setPlaying(false); go(+e.target.value); };
for (const id of ['tParticles', 'tTrails', 'tHeads']) $('#' + id).onchange = draw;
addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'BUTTON'].includes(e.target.tagName) && e.target.type !== 'checkbox') return;
  if (e.code === 'Space'){ e.preventDefault(); $('#play').click(); }
  if (e.code === 'ArrowRight') $('#fwd').click();
  if (e.code === 'ArrowLeft') $('#back').click();
});
requestAnimationFrame(tick);
resize();
</script>
</body>
</html>
